[project]
name = "ai-tutorial"
version = "0.1.0"
description = "AI Literacy Tutor — plain-language AI/ML glossary for non-technical professionals"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
    "plotly>=6.6.0",
    "pydantic>=2.12.5",
    "rapidfuzz>=3.14.3",
    "streamlit>=1.55.0",
]

[dependency-groups]
dev = [
    "anthropic>=0.84.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
